name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Decode OIDC token claims
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL?audience=https://registry.npmjs.org/" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.stringify(JSON.parse(s).value||s))}catch(e){console.log(s)}})")
          echo "$TOKEN" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const p=JSON.parse(s);console.log('repository='+p.repository);console.log('repository_owner='+p.repository_owner);console.log('repository_owner_id='+p.repository_owner_id);console.log('workflow='+p.workflow);console.log('ref='+p.ref);console.log('sha='+p.sha);console.log('actor='+p.actor);console.log('audience='+p.audience);console.log('issuer='+p.iss);console.log('exp='+p.exp);})"
