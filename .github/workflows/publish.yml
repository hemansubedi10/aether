name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          # NOTE: deliberately no registry-url. With registry-url set,
          # actions/setup-node injects NODE_AUTH_TOKEN (from the automatic
          # GITHUB_TOKEN) into the job env for all later steps and writes a
          # `_authToken=` line to the npmrc. npm then prefers that token over
          # the OIDC trusted-publishing exchange and fails with ENEEDAUTH.
          # npm's default registry is already https://registry.npmjs.org/.

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        # Trusted Publishing: no NPM_TOKEN needed, OIDC id-token handles auth.
        run: npm publish --access public
