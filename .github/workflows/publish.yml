name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Strip empty _authToken from npmrc
        # actions/setup-node with registry-url writes
        # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` to the npmrc.
        # With no NODE_AUTH_TOKEN secret (correct for Trusted Publishing) the
        # placeholder expands to empty, npm treats it as "auth configured" and
        # never triggers the OIDC exchange -> ENEEDAUTH. Strip the line so OIDC kicks in.
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$RUNNER_TEMP/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
          fi

      - name: Publish
        # Trusted Publishing: no NPM_TOKEN needed, OIDC id-token handles auth.
        run: npm publish --access public
