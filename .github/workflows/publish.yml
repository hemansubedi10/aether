name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Decode OIDC JWT claims
        run: |
          curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL?audience=https://registry.npmjs.org/" | node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
              const jwt = JSON.parse(s).value;
              const payload = JSON.parse(Buffer.from(jwt.split('.')[1], 'base64').toString());
              console.log(JSON.stringify(payload, null, 2));
            });
          "
