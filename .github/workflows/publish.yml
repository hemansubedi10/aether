name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Debug npmrc and OIDC env
        run: |
          echo "=== NPM_CONFIG_USERCONFIG=$NPM_CONFIG_USERCONFIG ==="
          echo "=== RUNNER_TEMP=$RUNNER_TEMP ==="
          echo "=== ACTIONS_ID_TOKEN_REQUEST_URL=$ACTIONS_ID_TOKEN_REQUEST_URL ==="
          echo "=== npmrc files ==="
          ls -la "$NPM_CONFIG_USERCONFIG" "$RUNNER_TEMP/.npmrc" "$HOME/.npmrc" 2>&1
          echo "=== contents of NPM_CONFIG_USERCONFIG ==="
          cat "$NPM_CONFIG_USERCONFIG" 2>&1
          echo "=== npm config list ==="
          npm config list 2>&1

      - name: Strip empty _authToken from npmrc
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$RUNNER_TEMP/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
          fi
          echo "=== after strip ==="
          cat "$npmrc" 2>&1

      - name: Publish
        run: npm publish --access public
