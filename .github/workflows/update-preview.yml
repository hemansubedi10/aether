name: update-preview

on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Capture /help
        run: npx tsx src/index.ts /help > docs/preview.txt

      - name: Append /stats
        run: |
          printf '\n\n=== /stats ===\n' >> docs/preview.txt
          npx tsx src/index.ts /stats >> docs/preview.txt

      - name: Commit preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/preview.txt
          git commit -m "Update docs/preview.txt" || echo "No changes to commit"
          git push
